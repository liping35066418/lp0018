<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D展厅搭建实训系统 - 关卡选择</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="levels-page">
  <div id="app">
    <header class="app-header">
      <div class="logo">
        <span class="logo-icon">🏗️</span>
        <h1 class="app-title">3D展厅搭建实训系统</h1>
      </div>
      <div class="header-info">
        <span class="system-status">
          <span class="status-dot"></span>
          <span>校验引擎运行中</span>
        </span>
      </div>
    </header>

    <main class="main-content">
      <section class="intro-section">
        <div class="intro-content">
          <h2 class="section-title">岗前实训关卡</h2>
          <p class="section-desc">掌握空间布局、光源设计、性能优化三大核心技能，通过多层约束并行校验，成为专业3D展厅设计师</p>
        </div>
        <div class="constraints-preview">
          <div class="constraint-badge">
            <span class="badge-icon">📏</span>
            <span class="badge-text">通道宽度</span>
          </div>
          <div class="constraint-badge">
            <span class="badge-icon">💡</span>
            <span class="badge-text">光源遮挡</span>
          </div>
          <div class="constraint-badge">
            <span class="badge-icon">📊</span>
            <span class="badge-text">模型面数</span>
          </div>
        </div>
      </section>

      <section class="levels-grid" id="levels-grid">
        <div class="levels-loading">
          <div class="loading-spinner"></div>
          <span>正在加载关卡...</span>
        </div>
      </section>

      <section class="quick-test-section">
        <h3 class="quick-test-title">⚡ 快速验证校验逻辑</h3>
        <p class="quick-test-desc">选择测试类型，系统将自动生成违规场景，一键验证多层并行校验引擎</p>
        <div class="test-buttons">
          <button class="test-btn" data-test="narrow_channel">
            <span class="test-icon">🚧</span>
            <span class="test-name">狭窄通道</span>
            <span class="test-desc">通道宽度不足</span>
          </button>
          <button class="test-btn" data-test="high_polycount">
            <span class="test-icon">📈</span>
            <span class="test-name">面数超标</span>
            <span class="test-desc">总面数超限</span>
          </button>
          <button class="test-btn" data-test="light_occlusion">
            <span class="test-icon">🚫</span>
            <span class="test-name">光源遮挡</span>
            <span class="test-desc">光线被遮挡</span>
          </button>
          <button class="test-btn test-all" data-test="all">
            <span class="test-icon">🔥</span>
            <span class="test-name">综合违规</span>
            <span class="test-desc">全部三项违规</span>
          </button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>后端服务: <span class="mono">http://localhost:9918</span> | 前端服务: <span class="mono">http://localhost:3917</span></p>
    </footer>
  </div>

  <script src="js/levels.js"></script>
</body>
</html>
